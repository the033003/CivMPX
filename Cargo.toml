[package]
name = "civmpx"
version = "0.1.0"
edition = "2024"
description = "Modern multiplayer extension tooling for Sid Meier's Civilization V"
license = "MIT"
readme = "README.md"
keywords = ["civilization", "civ5", "multiplayer", "proton", "patching"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
walkdir = "2.5"
